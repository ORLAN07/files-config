AWSTemplateFormatVersion: "2010-09-09"
Parameters:
 S3Bucket:
  Type: String
  Description: Enter the name of the s3bucket you uploaded the leeter source to
 S3Key:
  Type: String
  Description: Enter the name of the file you uploaded (probably leeter-elastic-beanstalk-python.zip)
  Default: leeter-elastic-beanstalk-python.zip
Resources:
 LeeterApplication:
  Type: AWS::ElasticBeanstalk::Application
  Properties:
   ApplicationName: Leeter
   Description: An application that l33ts text
 LeeterApplicationVersion:
  Type: AWS::ElasticBeanstalk::ApplicationVersion
  Properties:
   ApplicationName: !Ref LeeterApplication
   SourceBundle:
    S3Bucket: !Ref S3Bucket
    S3Key: !Ref S3Key
 LeeterServiceRole:
  Type: AWS::IAM::Role
  Properties:
   RoleName: microservicemagic-leeter-service-role
   AssumeRolePolicyDocument:
    Version: 2012-10-17
    Statement:
    - Sid: ''
      Effect: Allow
      Principal:
       Service: elasticbeanstalk.amazonaws.com
      Action: 'sts:AssumeRole'
      Condition:
       StringEquals:
        'sts:ExternalId': elasticbeanstalk
   ManagedPolicyArns:
    - arn:aws:iam::aws:policy/service-role/AmazonEC2RoleforSSM
    - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
    - arn:aws:iam::aws:policy/service-role/AWSElasticBeanstalkEnhancedHealth
    - arn:aws:iam::aws:policy/service-role/AWSElasticBeanstalkService
 LeeterInstanceRole:
  Type: AWS::IAM::Role
  Properties:
   RoleName: microservicemagic-leeter-instance-role
   AssumeRolePolicyDocument:
    Version: 2012-10-17
    Statement:
    - Sid: ''
      Effect: Allow
      Principal:
       Service: 
        - elasticbeanstalk.amazonaws.com
        - ec2.amazonaws.com
        - lambda.amazonaws.com
      Action: 'sts:AssumeRole'
   ManagedPolicyArns:
    - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
    - arn:aws:iam::aws:policy/AmazonSSMPatchAssociation
    - arn:aws:iam::aws:policy/service-role/AWSElasticBeanstalkEnhancedHealth
    - arn:aws:iam::aws:policy/AWSElasticBeanstalkManagedUpdatesCustomerRolePolicy
    - arn:aws:iam::aws:policy/AWSElasticBeanstalkMulticontainerDocker
    - arn:aws:iam::aws:policy/AWSElasticBeanstalkWebTier
    - arn:aws:iam::aws:policy/AWSElasticBeanstalkWorkerTier
    - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
    - arn:aws:iam::aws:policy/AmazonEC2ReadOnlyAccess
   Policies:
    - PolicyName: EC2Extras
      PolicyDocument: 
       Version: "2012-10-17"
       Statement:
        - Effect: Allow
          Action: 
           - ec2:ModifyInstanceAttribute
           - ec2:TerminateInstances
          Resource: '*'
 LeeterInstanceProfile:
  Type: AWS::IAM::InstanceProfile
  Properties:
   Path: /
   Roles:
    - !Ref LeeterInstanceRole
   InstanceProfileName: microservicemagic-leeter-instance-role
 LeeterEnvironment:
  Type: AWS::ElasticBeanstalk::Environment
  Properties:
   ApplicationName: !Ref LeeterApplication
   EnvironmentName: Leeter
   VersionLabel: !Ref LeeterApplicationVersion
   Tier:
    Name: WebServer
    Type: Standard
   OptionSettings:
    - Namespace: aws:autoscaling:launchconfiguration
      OptionName: IamInstanceProfile
      Value: !Ref LeeterInstanceProfile
    - Namespace: aws:elasticbeanstalk:environment 
      OptionName: ServiceRole
      Value: !Ref LeeterServiceRole
    - Namespace: aws:autoscaling:launchconfiguration
      OptionName: DisableIMDSv1
      Value: True
    - Namespace: aws:autoscaling:launchconfiguration
      OptionName: RootVolumeType
      Value: gp3
    - Namespace: aws:elasticbeanstalk:environment
      OptionName: LoadBalancerType
      Value: application
    - Namespace: aws:elasticbeanstalk:xray
      OptionName: XRayEnabled
      Value: true
    - Namespace: aws:elasticbeanstalk:cloudwatch:logs
      OptionName: StreamLogs
      Value: true
    - Namespace: aws:elasticbeanstalk:cloudwatch:logs
      OptionName: DeleteOnTerminate
      Value: true
    - Namespace: aws:elasticbeanstalk:cloudwatch:logs
      OptionName: RetentionInDays
      Value: 1
    - Namespace: aws:autoscaling:asg
      OptionName: MinSize
      Value: 5
    - Namespace: aws:autoscaling:asg
      OptionName: MaxSize
      Value: 10
   SolutionStackName: 64bit Amazon Linux 2023 v4.2.0 running Python 3.9
Outputs:
 LeeterEndpoint:
  Description: The endpoint of the leeter elastic beanstalk environment
  Value: !Join ["", ["http://", !GetAtt LeeterEnvironment.EndpointURL]]